name: GitHub Pages
on:
  push:
    branches: ["v0.0.9-docs"]
# Concurrency control to prevent parallel runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: read
jobs:
  deploy_docs:
    name: Deploy the docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # - name: Install git LFS (and tools needed by hooks)
      #   run: |
      #     apt-get update
      #     apt-get install -y --no-install-recommends git git-lfs clang-format ca-certificates make
      #     git --version
      #     git lfs version

      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          fetch-tags: true
      # Build docs
      - name: Build docs
        run: |
          cd docs
          pip3 install -r requirements.txt
          make SPHINXOPTS=-W multi-docs
          touch ./_build/.nojekyll
      # Deploy to gh-pages
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build
